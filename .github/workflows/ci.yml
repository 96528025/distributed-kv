name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration-test:
    name: 3-node Raft integration test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify the public surface is English-only
        run: |
          if git grep -n -I -P '[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}]' -- .; then
            echo "CJK text is not allowed on the public branch."
            exit 1
          fi

      # No pip install: the KV store and its test suite use only the standard library.
      - name: Run metrics and observability tests (9 checks)
        run: python3 -m unittest -v test_metrics.py

      # This step spins up a real 3-node cluster on localhost:5001-5003 and runs all
      # 56 integration checks. It is intentionally NOT a lint or syntax check.
      - name: Run full integration suite (56 checks)
        run: python3 test_raft_sharded.py

      # Safety regression suite. Each check maps to a named invariant in
      # docs/RAFT_CORRECTNESS.md. Deterministic: one real node with its election
      # timeout pinned, driven by hand-built RPCs.
      - name: Run Raft correctness suite (24 checks)
        run: python3 test_raft_correctness.py

      # Pure routing logic, no cluster: Leader hint, unreachable fallback, lock
      # conflict, repeated txn_id, phase-2 participant selection.
      - name: Run transaction routing suite (5 tests)
        run: python3 test_txn_routing.py

      # Real 3-node cluster on 5101-5103, including a live failure-injection
      # regression that SIGSTOPs the leader and asserts the isolated old leader
      # refuses the stale read.
      - name: Run read-quorum suite (4 tests)
        run: python3 test_read_quorum.py

      # Storage layer: WAL framing and checksum replay, atomic checkpoint
      # publication, and a real 3-node cluster on 6301-6303 taken down twice
      # with SIGKILL. Runs entirely inside its own temp dirs.
      - name: Run WAL and checkpoint suite (17 checks)
        run: python3 test_wal.py

      - name: Clean up stray node processes and test artifacts
        if: always()
        run: |
          pkill -f node_raft_sharded.py || true
          rm -f data_raft_sharded_*.json snapshot_*.json raft_hardstate_*.json* \
                wal_*.log checkpoint_*.json*
